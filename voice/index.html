<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: one centered console. The orb is the only control that matters; the transcript sits under it. */
  :root {
    --bg: #0b1016;
    --panel: #121a23;
    --line: #22303d;
    --fg: #dbe5ee;
    --muted: #7d8c99;
    --core: #6fc8e8;
    --warm: #e8b46f;
    --danger: #e87a6f;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body);
    display: flex; flex-direction: column; align-items: center;
    padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  h1 { font: 600 22px/1 var(--display); letter-spacing: .35em; margin: 0; padding-left: .35em; }
  .status { font: 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); min-height: 1em; }

  .orb {
    --c: var(--core);
    width: 200px; height: 200px; max-width: 60vw; max-height: 60vw; border-radius: 50%; border: 0; cursor: pointer; position: relative;
    background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 85%, white) 0 14%, color-mix(in srgb, var(--c) 35%, transparent) 15% 34%, transparent 35%),
                radial-gradient(circle, transparent 55%, color-mix(in srgb, var(--c) 18%, transparent) 56% 58%, transparent 59%);
    box-shadow: 0 0 60px color-mix(in srgb, var(--c) 25%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent);
    transition: box-shadow .3s, transform .2s;
  }
  .orb::after {
    content: ""; position: absolute; inset: 10%; border-radius: 50%;
    border: 2px dashed color-mix(in srgb, var(--c) 45%, transparent);
  }
  .orb:focus-visible { outline: 2px solid var(--c); outline-offset: 6px; }
  body[data-state="listening"] .orb { --c: var(--core); box-shadow: 0 0 110px color-mix(in srgb, var(--c) 55%, transparent), inset 0 0 0 1px var(--c); }
  body[data-state="listening"] .orb::after { animation: spin 6s linear infinite; }
  body[data-state="thinking"] .orb { --c: var(--warm); }
  body[data-state="thinking"] .orb::after { animation: spin 1.4s linear infinite; }
  body[data-state="speaking"] .orb { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .orb, .orb::after { animation: none !important; } }

  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: -8px 0 0; }
  .heard { font: 17px/1.4 var(--body); color: var(--core); min-height: 1.4em; text-align: center; text-wrap: balance; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; font-size: 13px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: 13px var(--body); max-width: 220px; }

  form { display: flex; gap: 8px; width: 100%; }
  input[type="text"] { flex: 1; min-width: 0; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 15px var(--body); }
  input[type="text"]:focus-visible, button:focus-visible { outline: 2px solid var(--core); outline-offset: 2px; }
  .send { background: transparent; color: var(--core); border: 1px solid var(--core); border-radius: 8px; padding: 0 16px; font: 600 13px var(--display); letter-spacing: .1em; cursor: pointer; }

  .log { width: 100%; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 20px; }
  .turn { display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
  .turn .who { font: 11px/1.9 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .turn.jarvis .who { color: var(--core); }
  .turn p { margin: 0; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notice { color: var(--danger); font-size: 13px; text-align: center; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body data-state="idle">
<main>
  <h1>JARVIS</h1>
  <div class="status" id="status">Ready</div>
  <button class="orb" id="orb" aria-label="Talk to Jarvis"></button>
  <p class="hint" id="hint">Click the orb (or press Space) and speak. Click again to interrupt.</p>
  <div class="heard" id="heard" aria-live="polite"></div>

  <div class="controls">
    <label><input type="checkbox" id="handsfree"> Keep listening after each reply</label>
    <label><input type="checkbox" id="wake"> Wake word "Jarvis"</label>
    <label>Voice <select id="voice"></select></label>
  </div>
  <p class="notice" id="notice" hidden></p>

  <form id="typed">
    <label for="text" hidden>Message</label>
    <input type="text" id="text" placeholder="Or type to Jarvis" autocomplete="off">
    <button class="send" type="submit">SEND</button>
  </form>

  <section class="log" id="log" aria-live="polite">
    <p class="empty" id="empty">Try: "Jarvis, what should I work on today?"</p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const history = [];
let state = "idle";
let abortCtl = null;
let recognition = null;
let wantListening = false;

function setState(s, label) {
  state = s;
  document.body.dataset.state = s;
  $("status").textContent = label || { idle: "Ready", listening: "Listening", thinking: "Thinking", speaking: "Speaking" }[s];
}

function notice(msg) {
  $("notice").textContent = msg;
  $("notice").hidden = !msg;
}

function addTurn(who, text) {
  $("empty")?.remove();
  const row = document.createElement("div");
  row.className = "turn " + (who === "You" ? "you" : "jarvis");
  const w = document.createElement("span"); w.className = "who"; w.textContent = who;
  const p = document.createElement("p"); p.textContent = text;
  row.append(w, p);
  $("log").append(row);
  row.scrollIntoView({ block: "nearest" });
  return p;
}

// ---- Voice out (browser text-to-speech) ----
const synth = window.speechSynthesis;
let speakQueue = 0;
let speakGen = 0; // bumped on cancel so stale utterance callbacks are ignored

function pickVoices() {
  const voices = synth ? synth.getVoices().filter((v) => v.lang.startsWith("en")) : [];
  const sel = $("voice");
  if (!voices.length) return;
  const saved = store.get("jarvis.voice");
  const preferred = ["Google UK English Male", "Daniel", "Microsoft Ryan", "Microsoft George", "Arthur"];
  sel.innerHTML = "";
  for (const v of voices) {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
    sel.append(o);
  }
  const match = voices.find((v) => v.name === saved)
    || voices.find((v) => preferred.some((p) => v.name.includes(p)))
    || voices.find((v) => v.lang === "en-GB") || voices[0];
  sel.value = match.name;
}
if (synth) { pickVoices(); synth.onvoiceschanged = pickVoices; }
$("voice").onchange = (e) => store.set("jarvis.voice", e.target.value);

function speak(text) {
  text = text.replace(/[*_#`>]/g, "").trim();
  if (!synth || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = synth.getVoices().find((x) => x.name === $("voice").value);
  if (v) u.voice = v;
  u.rate = 1.03;
  const gen = speakGen;
  speakQueue++;
  setState("speaking");
  u.onend = u.onerror = () => {
    if (gen !== speakGen) return;
    speakQueue--;
    if (speakQueue <= 0 && !abortCtl) afterReply();
  };
  synth.speak(u);
}

function stopSpeaking() {
  speakGen++;
  speakQueue = 0;
  synth?.cancel();
}

function afterReply() {
  setState("idle");
  if ($("handsfree").checked || $("wake").checked) startListening();
}

// ---- Thinking (Claude via the local server) ----
async function ask(text) {
  stopListening();
  stopSpeaking();
  abortCtl?.abort();
  history.push({ role: "user", content: text });
  addTurn("You", text);
  const out = addTurn("Jarvis", "…");
  setState("thinking");

  const ctl = abortCtl = new AbortController();
  let full = "", pending = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
      signal: ctl.signal,
    });
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      const chunk = dec.decode(value, { stream: true });
      full += chunk; pending += chunk;
      out.textContent = full;
      // Speak each finished sentence as soon as it arrives.
      const m = pending.match(/^[\s\S]*[.!?](\s|$)/);
      if (m) { speak(m[0]); pending = pending.slice(m[0].length); }
    }
    speak(pending);
    history.push({ role: "assistant", content: full || "(no reply)" });
  } catch (e) {
    if (e.name === "AbortError") { history.push({ role: "assistant", content: full || "(interrupted)" }); return; }
    out.textContent = "I can't reach my server. Is python voice/server.py still running?";
    history.pop();
    setState("idle");
    return;
  } finally {
    if (abortCtl === ctl) abortCtl = null;
  }
  if (speakQueue <= 0) afterReply();
}

// ---- Ears (browser speech recognition) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  notice("This browser can't do speech recognition. Use Chrome, Edge or Safari, or type below.");
}

function startListening() {
  if (!SR || state === "listening") return;
  wantListening = true;
  const wakeMode = $("wake").checked;
  recognition = new SR();
  recognition.lang = navigator.language || "en-US";
  recognition.interimResults = true;
  recognition.continuous = wakeMode;
  let finalText = "";

  recognition.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) {
        const said = r[0].transcript.trim();
        if (wakeMode) {
          const m = said.match(/\bjarvis\b[,.!?]?\s*(.*)/i);
          if (m) { finalText = m[1] || "Yes?"; recognition.stop(); }
        } else {
          finalText += " " + said;
        }
      } else {
        interim += r[0].transcript;
      }
    }
    $("heard").textContent = interim || finalText.trim();
  };
  recognition.onerror = (ev) => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      wantListening = false;
      notice("Microphone access was blocked. Allow the microphone for this page in your browser's address bar, then try again.");
    }
  };
  recognition.onend = () => {
    recognition = null;
    const text = finalText.trim();
    $("heard").textContent = "";
    if (text) { ask(text); return; }
    if (wantListening && wakeMode) { startListening(); return; } // keep waiting for "Jarvis"
    wantListening = false;
    if (state === "listening") setState("idle");
  };

  try {
    recognition.start();
    notice("");
    setState("listening", wakeMode ? 'Say "Jarvis…"' : "Listening");
  } catch { /* already started */ }
}

function stopListening() {
  wantListening = false;
  if (recognition) { recognition.onend = null; recognition.abort(); recognition = null; }
  $("heard").textContent = "";
}

// ---- Controls ----
$("orb").onclick = () => {
  if (state === "listening") { stopListening(); setState("idle"); return; }
  if (state === "thinking" || state === "speaking") {
    abortCtl?.abort(); stopSpeaking(); setState("idle");
    startListening();
    return;
  }
  startListening();
};

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "SELECT") {
    e.preventDefault(); $("orb").click();
  }
  if (e.key === "Escape") { abortCtl?.abort(); stopSpeaking(); stopListening(); setState("idle"); }
});

$("typed").onsubmit = (e) => {
  e.preventDefault();
  const t = $("text").value.trim();
  if (!t) return;
  $("text").value = "";
  ask(t);
};

for (const id of ["handsfree", "wake"]) {
  const el = $(id);
  el.checked = store.get("jarvis." + id) === "1";
  el.onchange = () => {
    store.set("jarvis." + id, el.checked ? "1" : "0");
    if (id === "wake") { stopListening(); if (el.checked) startListening(); else setState("idle"); }
  };
}
</script>
</body>
</html>
